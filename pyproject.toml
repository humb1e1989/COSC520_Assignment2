[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cosc520-assignment2"
version = "0.1.0"
description = "Comparison of three dynamic range-sum data structures"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

